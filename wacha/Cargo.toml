[package]
name = "wacha"
version = "0.1.0"
edition = "2021"
publish = false
description = "วาจา (WACHA) — Word Architecture, Cluster-aware Hybrid Analysis: katgpt-rs Datrie segmenter + vendored AXIOM knowledge graph for explainable Thai word relationships (ORST Dictionary Reimagined hackathon)."

[lib]
name = "wacha"
path = "src/lib.rs"

[[bin]]
name = "wacha"
path = "src/bin/cli.rs"

[[bin]]
name = "wacha-web"
path = "src/bin/web.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }

[dev-dependencies]
